<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1671 941" preserveAspectRatio="none">
  <!-- Rumbo splash — cream map panel (vector, sharp at any resolution).
       Shape traced from the original design: top band, quarter arch, two steps down. -->
  <defs>
    <clipPath id="panel">
      <path id="shape" d="M0 0H1054V62C860 62 722 160 722 291H682V623H637V941H0Z"/>
    </clipPath>
    <!-- fine paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.33  0 0 0 0.10 0"/>
    </filter>
    <!-- soft warm shading, a little darker toward the edges -->
    <radialGradient id="shade" cx="30%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F6EFE2"/>
      <stop offset="1" stop-color="#EDE3CF"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1671" height="941" fill="url(#shade)"/>
    <rect width="1671" height="941" filter="url(#grain)"/>

    <!-- map contour lines (very faint) -->
    <g fill="none" stroke="#C9B48A" stroke-opacity=".28" stroke-width="1.2">
      <path d="M-20 560C90 575 170 640 215 720S290 880 330 960"/>
      <path d="M-20 600C70 615 140 670 180 745S245 890 280 960"/>
      <path d="M-20 640C50 655 110 705 145 770S200 900 230 960"/>
      <path d="M-20 680C35 695 80 735 108 795S150 905 172 960"/>
      <path d="M-20 520C120 530 220 600 270 690S350 870 395 960"/>
      <path d="M640 690C585 710 545 760 530 830S525 920 535 960"/>
      <path d="M640 740C600 755 575 795 565 850S562 925 570 960"/>
      <path d="M-20 360C40 330 60 270 40 210S-10 120 -20 100" stroke-opacity=".18"/>
    </g>

    <!-- dashed flight path with a loop, ending at the plane -->
    <g fill="none" stroke="#C3A97B" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="7 7" stroke-linecap="round">
      <path d="M-10 300C40 298 70 285 95 262C130 230 115 195 80 196C42 198 28 238 52 252C80 268 118 238 140 205C162 170 168 138 160 122"/>
      <path d="M-10 75C30 72 70 80 100 98C120 110 135 118 148 118" stroke-opacity=".6"/>
      <path d="M178 104C205 80 222 55 222 30S205 -5 190 -10" stroke-opacity=".6"/>
    </g>
    <!-- plane -->
    <g transform="translate(152 112) rotate(-38) scale(1.45)" fill="#C9AF83">
      <path d="M11 -1.5V-8a1.5 1.5 0 0 0-3 0v6.5l-8 5v2l8-2.5V8l-2 1.5V11l3.5-1 3.5 1V9.5L11 8V3l8 2.5v-2z" transform="translate(-9.5 -1)"/>
    </g>

    <!-- compass rose -->
    <g transform="translate(110 802)">
      <circle r="44" fill="none" stroke="#C3A97B" stroke-opacity=".7" stroke-width="1.2"/>
      <circle r="38" fill="none" stroke="#C3A97B" stroke-opacity=".45" stroke-width=".8"/>
      <g fill="#CDB489">
        <path d="M0 -58L7 -7L0 0Z"/><path d="M0 -58L-7 -7L0 0Z" fill="#B99B68"/>
        <path d="M58 0L7 7L0 0Z"/><path d="M58 0L7 -7L0 0Z" fill="#B99B68"/>
        <path d="M0 58L-7 7L0 0Z"/><path d="M0 58L7 7L0 0Z" fill="#B99B68"/>
        <path d="M-58 0L-7 -7L0 0Z"/><path d="M-58 0L-7 7L0 0Z" fill="#B99B68"/>
        <g opacity=".8">
          <path d="M28 -28L4 -2L0 0Z"/><path d="M28 -28L2 -4L0 0Z" fill="#B99B68"/>
          <path d="M28 28L2 4L0 0Z"/><path d="M28 28L4 2L0 0Z" fill="#B99B68"/>
          <path d="M-28 28L-4 2L0 0Z"/><path d="M-28 28L-2 4L0 0Z" fill="#B99B68"/>
          <path d="M-28 -28L-2 -4L0 0Z"/><path d="M-28 -28L-4 -2L0 0Z" fill="#B99B68"/>
        </g>
        <circle r="3.2" fill="#B99B68"/>
      </g>
      <g fill="#B99B68" font-family="Georgia, 'Times New Roman', serif" font-size="13" text-anchor="middle">
        <text y="-62">N</text><text x="68" y="5">E</text><text y="74">S</text><text x="-68" y="5">W</text>
      </g>
    </g>
  </g>

  <!-- crisp edge along the arch -->
  <use href="#shape" fill="none" stroke="#E6DAC2" stroke-width="1.5" stroke-opacity=".6"/>
</svg>
